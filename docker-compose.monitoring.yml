version: "3.8"

# FramerClone Monitoring & Security Stack
# Deploy: docker stack deploy -c docker-compose.monitoring.yml monitoring
#
# Services:
# - Prometheus: Metrics collection (protected by basic auth)
# - Grafana: Visualization dashboards (strong password required)
# - Loki: Log aggregation
# - Promtail: Log shipping from Docker
# - Node Exporter: Host system metrics
# - cAdvisor: Container metrics
# - Wazuh Manager: File integrity + rootkit detection

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/prometheus.htpasswd:/etc/prometheus/prometheus.htpasswd:ro
      - prometheus-data:/prometheus
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`metrics.clone.webyverse.com`)"
        - "traefik.http.routers.prometheus.entrypoints=websecure"
        - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
        - "traefik.http.routers.prometheus.middlewares=prometheus-auth"
        - "traefik.http.middlewares.prometheus-auth.basicauth.users=admin:$$2b$$10$$YLl3zfA8NcGLo72IUnhvV.KKfaY/Czxja9pQ91sgr0SwnYfDE82dC"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:10.4.5
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=false
      - GF_SERVER_ROOT_URL=https://dashboard.clone.webyverse.com
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`dashboard.clone.webyverse.com`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  loki:
    image: grafana/loki:2.9.10
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  promtail:
    image: grafana/promtail:2.9.10
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - dokploy-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  node-exporter:
    image: prom/node-exporter:v1.8.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - dokploy-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - dokploy-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  wazuh-manager:
    image: wazuh/wazuh-manager:4.8.0
    environment:
      - WAZUH_MANAGER=${WAZUH_MANAGER:-127.0.0.1}
      - WAZUH_MANAGER_NAME=framerclone-vps
      - WAZUH_REGISTRATION_PASSWORD=${WAZUH_REGISTRATION_PASSWORD:-}
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - /var/log:/host/var/log:ro
      - /var/lib/docker/containers:/host/var/lib/docker/containers:ro
      - /:/host/rootfs:ro
    networks:
      - dokploy-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

networks:
  dokploy-network:
    external: true

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  wazuh-manager-data:
