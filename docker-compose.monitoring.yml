version: "3.8"

# FramerClone Monitoring & Security Stack
# Deploy: docker stack deploy -c docker-compose.monitoring.yml monitoring
#
# Services:
# - Prometheus: Metrics collection (protected by basic auth)
# - Grafana: Visualization dashboards (strong password required)
# - Loki: Log aggregation
# - Promtail: Log shipping from Docker
# - Node Exporter: Host system metrics
# - cAdvisor: Container metrics
# - Wazuh Manager: File integrity + rootkit detection + security alerts
# - Wazuh Indexer: OpenSearch-based alert storage
# - Wazuh Dashboard: Web UI for security alerts

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/prometheus.htpasswd:/etc/prometheus/prometheus.htpasswd:ro
      - prometheus-data:/prometheus
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`metrics.clone.webyverse.com`)"
        - "traefik.http.routers.prometheus.entrypoints=websecure"
        - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
        - "traefik.http.routers.prometheus.middlewares=prometheus-auth"
        - "traefik.http.middlewares.prometheus-auth.basicauth.users=admin:$$2b$$10$$YLl3zfA8NcGLo72IUnhvV.KKfaY/Czxja9pQ91sgr0SwnYfDE82dC"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:10.4.5
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=false
      - GF_SERVER_ROOT_URL=https://dashboard.clone.webyverse.com
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`dashboard.clone.webyverse.com`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  loki:
    image: grafana/loki:2.9.10
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  promtail:
    image: grafana/promtail:2.9.10
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - dokploy-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  node-exporter:
    image: prom/node-exporter:v1.8.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - dokploy-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - dokploy-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  wazuh-manager:
    image: wazuh/wazuh-manager:4.8.0
    hostname: wazuh-manager
    environment:
      - WAZUH_MANAGER=${WAZUH_MANAGER:-127.0.0.1}
      - WAZUH_MANAGER_NAME=framerclone-vps
      - WAZUH_REGISTRATION_PASSWORD=${WAZUH_REGISTRATION_PASSWORD:-}
      - INDEXER_IP=wazuh-indexer
      - INDEXER_PORT=9200
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - wazuh-logs:/var/ossec/logs
      - /var/log:/host/var/log:ro
      - /var/lib/docker/containers:/host/var/lib/docker/containers:ro
      - /:/host/rootfs:ro
    networks:
      - dokploy-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.8.0
    hostname: wazuh-indexer
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - node.name=wazuh-indexer
      - cluster.name=wazuh-cluster
      - cluster.initial_master_nodes=wazuh-indexer
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/wazuh/certs:/usr/share/wazuh-indexer/certs:ro
    networks:
      dokploy-network:
        aliases:
          - wazuh.indexer
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      # Memory limit removed — OpenSearch security plugin needs >256MB direct buffer
      # which fails under Docker memory limits. VPS has 5.1GB available.
      # resources:
      #   limits:
      #     memory: 3G

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    hostname: wazuh-dashboard
    environment:
      - OPENSEARCH_HOSTS=https://wazuh-indexer:9200
      - WAZUH_API_URL=https://wazuh-manager:55000
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-admin}
      - DASHBOARD_USERNAME=${WAZUH_DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD:-admin}
    volumes:
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/wazuh/certs:/usr/share/wazuh-dashboard/certs:ro
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.wazuh.rule=Host(`wazuh.clone.webyverse.com`)"
        - "traefik.http.routers.wazuh.entrypoints=websecure"
        - "traefik.http.routers.wazuh.tls.certresolver=letsencrypt"
        - "traefik.http.routers.wazuh.middlewares=wazuh-auth"
        - "traefik.http.middlewares.wazuh-auth.basicauth.users=admin:$$2b$$10$$YLl3zfA8NcGLo72IUnhvV.KKfaY/Czxja9pQ91sgr0SwnYfDE82dC"
        - "traefik.http.services.wazuh.loadbalancer.server.port=5601"
        - "traefik.http.services.wazuh.loadbalancer.server.scheme=https"
        - "traefik.http.services.wazuh.loadbalancer.serversTransport=wazuh-insecure@file"

  wazuh-exporter:
    image: python:3.11-slim
    command: >
      sh -c "pip install --no-cache-dir prometheus-client==0.20.0 &&
             python /app/exporter.py"
    environment:
      - WAZUH_ALERTS_DIR=/var/ossec/logs/alerts
      - PORT=9101
      - SCRAPE_INTERVAL=60
    volumes:
      - /var/lib/dokploy/applications/framerclone-portal/monitoring/wazuh-exporter/exporter.py:/app/exporter.py:ro
      - wazuh-logs:/var/ossec/logs:ro
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  dokploy-network:
    external: true

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  wazuh-manager-data:
  wazuh-indexer-data:
  wazuh-dashboard-data:
  wazuh-logs:
