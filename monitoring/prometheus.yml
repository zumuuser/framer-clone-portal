global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'framerclone'
    static_configs:
      - targets: ['framerclone_blue:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
